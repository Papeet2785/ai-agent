[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Papeet2785", email = "carmeet2785@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.14.4",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "wikipedia>=1.4.0",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
